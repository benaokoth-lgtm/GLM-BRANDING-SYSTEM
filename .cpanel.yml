---
# cPanel Git Version Control deployment task — runs when you click "Deploy HEAD Commit" on
# this repo's "Pull or Deploy" tab.
#
# Nothing is built on the server. deploy/ is prebuilt and committed (regenerate it with
# `npm run build:cpanel` and commit the result — see DEPLOYMENT.md):
#   deploy/web  → copied to app.glmgroup.co.ke's document root (static files).
#                 NOT pos.glmgroup.co.ke — that hosts a separate PHP point-of-sale system.
#   deploy/api  → is the Node.js App's Application root itself, so it only needs a restart
#
# Dependency installs for the API (deploy/api/package.json) are done from Setup Node.js App's
# "Run NPM Install" button, and only when that package.json changes.
deployment:
  tasks:
    - export REPOPATH=/home/glmgroup/repositories/glm-branding-pos-system/
    - export WEBROOT=/home/glmgroup/app.glmgroup.co.ke/
    # Safety: never copy over another application (a PHP site has an index.php).
    - if [ -f $WEBROOT/index.php ]; then echo "Refusing to deploy into $WEBROOT - it contains index.php (another app)."; else mkdir -p $WEBROOT && /bin/cp -R $REPOPATH/deploy/web/. $WEBROOT; fi
    - mkdir -p $REPOPATH/deploy/api/tmp
    - touch $REPOPATH/deploy/api/tmp/restart.txt
