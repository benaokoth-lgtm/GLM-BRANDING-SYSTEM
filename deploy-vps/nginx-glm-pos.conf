# Nginx for the GLM Branding POS on a VPS. setup-server.sh copies this to /etc/nginx/sites-available/glm-pos with WEB_HOST and API_HOST filled in.
# It listens on plain HTTP; `certbot --nginx` then adds HTTPS and the redirect (see DEPLOYMENT-VPS.md).

# The web app (static files, built by `npm run build:cpanel` into deploy/web and copied to /var/www/pos by update.sh).
server {
    listen 80;
    listen [::]:80;
    server_name __WEB_HOST__;
    server_tokens off;

    root /var/www/pos;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change: cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app: unknown paths (/orders/all …) load index.html. The page itself is never cached,
    # so a new deploy shows up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# The API (Node, listening only on 127.0.0.1:4100).
server {
    listen 80;
    listen [::]:80;
    server_name __API_HOST__;
    server_tokens off;

    # A company logo is sent as a base64 data URL in a JSON body; the API accepts up to 5 MB.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
